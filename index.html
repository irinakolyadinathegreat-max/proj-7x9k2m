<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Огненная коза</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
    }
    #hint {
      background: rgba(0,0,0,0.65); color: white; padding: 14px 18px;
      border-radius: 12px; text-align: center; font-size: 15px;
      line-height: 1.4; max-width: 360px; margin: 20px auto 0;
      backdrop-filter: blur(10px); transition: opacity 0.4s;
    }
    #hint.hidden { opacity: 0; }
    #status {
      align-self: center; background: rgba(0,0,0,0.65); color: #fff;
      padding: 8px 14px; border-radius: 20px; font-size: 13px;
      margin-bottom: 20px; backdrop-filter: blur(10px);
    }
    #loader {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #1a0f1a, #050308);
      color: white;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; font-size: 16px; text-align: center; padding: 20px;
    }
    #loader.hidden { display: none; }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.12);
      border-top-color: #ff7b3d; border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #start-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff7b3d, #b347ff);
      color: white; border: none; padding: 16px 36px;
      border-radius: 30px; font-size: 16px; font-weight: 600;
      cursor: pointer; margin-top: 28px;
      box-shadow: 0 4px 24px rgba(255,123,61,0.5);
      letter-spacing: 0.3px;
    }
    #start-btn:active { transform: scale(0.97); }
    .loader-title { font-size: 14px; opacity: 0.65; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
    .loader-sub { font-size: 18px; font-weight: 500; }

    /* Скрытое видео — оно работает как источник текстуры */
    #fire-video {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-title">Огненная коза</div>
    <div class="loader-sub">Пробуждаем магию...</div>
    <button id="start-btn" style="display:none;">Включить камеру</button>
  </div>

  <div id="overlay">
    <div id="hint">Наведи камеру на игрушку</div>
    <div id="status">Ищу козу...</div>
  </div>

  <!-- Видео-источник огня. Зациклено, без звука, готово к autoplay на мобильных -->
  <video id="fire-video"
         src="./fire.mp4"
         loop muted playsinline webkit-playsinline
         preload="auto"
         crossorigin="anonymous"></video>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.005;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-entity id="fire-container"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const startBtn = document.getElementById('start-btn');
    const loaderSub = loader.querySelector('.loader-sub');
    const hint = document.getElementById('hint');
    const status = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const targetEl = document.getElementById('target');
    const fireContainer = document.getElementById('fire-container');
    const fireVideo = document.getElementById('fire-video');

    // ====== Соотношение сторон маркера козы ======
    // ширина / высота. У нашей вертикальной козы ≈ 0.49.
    const KOZA_ASPECT = 0.490376;

    // ====== Создаём 3D-плоскость с видео-текстурой и шейдером chroma key ======
    function buildFirePlane() {
      // Видео как текстура
      const videoTexture = new THREE.VideoTexture(fireVideo);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;
      videoTexture.format = THREE.RGBAFormat;
      videoTexture.colorSpace = THREE.SRGBColorSpace;

      // Кастомный шейдер: убирает чёрный фон (chroma key по яркости),
      // плюс мягкое размытие на границе для плавности
      const material = new THREE.ShaderMaterial({
        uniforms: {
          videoTex: { value: videoTexture },
          // Параметры chroma key — можно подкручивать
          threshold: { value: 0.02 },   // ниже этой яркости — прозрачно (НИЗКО, чтобы не съесть мягкие края)
          softness:  { value: 0.35 },   // плавность перехода (ВЫШЕ — плавнее переход)
          glowBoost: { value: 1.25 },   // усиление яркости огня
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D videoTex;
          uniform float threshold;
          uniform float softness;
          uniform float glowBoost;
          varying vec2 vUv;

          void main() {
            vec4 color = texture2D(videoTex, vUv);
            // Яркость пикселя (luminance)
            float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
            // Прозрачность: чёрные пиксели → 0, светлые → 1
            float alpha = smoothstep(threshold, threshold + softness, lum);
            // Лёгкое усиление яркости огня
            vec3 finalColor = color.rgb * glowBoost;
            gl_FragColor = vec4(finalColor, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
      });

      // Размер плоскости под маркер. В MindAR ширина маркера = 1.
      // Высота = 1 / aspect. Чуть увеличим, чтобы огонь выходил за края.
      const planeW = 1.0;
      const planeH = planeW / KOZA_ASPECT;
      const scale = 1.25;  // даёт огню пространство сверху/снизу/по бокам
      const geo = new THREE.PlaneGeometry(planeW * scale, planeH * scale);
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.set(0, 0, 0.02);

      fireContainer.object3D.add(mesh);
    }

    // ====== Запуск видео нужно сделать после жеста пользователя (iOS требует) ======
    function startVideoPlayback() {
      const playPromise = fireVideo.play();
      if (playPromise) {
        playPromise.catch(err => {
          console.warn('Видео не стартовало автоматически:', err);
        });
      }
    }

    sceneEl.addEventListener('loaded', () => {
      loaderSub.textContent = 'Готово!';
      startBtn.style.display = 'inline-block';
      buildFirePlane();
    });

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Запускаю...';
      try {
        // 1. Запускаем видео (по жесту пользователя — это разрешено на iOS)
        startVideoPlayback();

        // 2. Запускаем камеру
        const mindarSystem = sceneEl.systems['mindar-image-system'];
        await mindarSystem.start();

        loader.classList.add('hidden');
        setTimeout(() => hint.classList.add('hidden'), 4500);
      } catch (err) {
        loaderSub.innerHTML = 'Не удалось получить доступ к камере.<br>Проверь разрешение в настройках браузера.';
        startBtn.style.display = 'none';
        console.error(err);
      }
    });

    targetEl.addEventListener('targetFound', () => {
      status.textContent = '🔥 Магия активна';
      hint.classList.add('hidden');
      // На случай если видео не играет — перезапустим
      if (fireVideo.paused) startVideoPlayback();
    });
    targetEl.addEventListener('targetLost', () => {
      status.textContent = 'Ищу козу...';
    });
  </script>
</body>
</html>
