<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Огненная коза</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }

    #overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.92);
    }
    #overlay h1 {
      color: #d4862a; font-size: 1.4rem; margin-bottom: 12px;
      text-align: center; letter-spacing: 0.08em;
    }
    #overlay p {
      color: #aaa; font-size: 0.85rem; text-align: center;
      max-width: 280px; line-height: 1.5; margin-bottom: 28px;
    }
    #startBtn {
      background: linear-gradient(135deg, #c0561a, #8b2200);
      color: #fff; border: none; border-radius: 30px;
      padding: 14px 36px; font-size: 1rem; cursor: pointer;
      letter-spacing: 0.06em;
    }
    #startBtn:active { opacity: 0.8; }

    #status {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 50; background: rgba(0,0,0,0.6); color: #f0a050;
      padding: 8px 20px; border-radius: 20px; font-size: 0.8rem;
      pointer-events: none; transition: opacity 0.5s;
    }

    canvas#fireCanvas {
      position: fixed; inset: 0; pointer-events: none;
      z-index: 10; display: none;
    }

    #arContainer {
      position: fixed; inset: 0; display: none;
    }
    video#cam {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div id="overlay">
  <h1>🔥 Огненная коза</h1>
  <p>Наведите камеру на игрушку — она оживёт в магическом пламени</p>
  <button id="startBtn">Включить камеру</button>
</div>

<div id="status">Ищу игрушку…</div>

<div id="arContainer">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="fireCanvas"></canvas>
</div>

<!-- MindAR + THREE.js -->
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// ─── Контур огненной рамки (нормализованные координаты) ───
const CONTOUR = [[0.008,0.275],[0.007,0.274],[0.002,0.27],[0.0,0.266],[-0.002,0.265],[-0.002,0.264],[-0.007,0.242],[-0.048,0.219],[-0.067,0.214],[-0.058,0.214],[-0.068,0.213],[0.062,0.211],[-0.072,0.21],[-0.072,0.209],[-0.07,0.209],[-0.072,0.206],[-0.068,0.201],[0.092,0.19],[-0.062,0.184],[-0.062,0.182],[0.053,0.182],[-0.062,0.181],[-0.06,0.181],[-0.062,0.18],[-0.062,0.179],[-0.062,0.178],[0.093,0.176],[0.093,0.175],[-0.062,0.174],[0.035,0.174],[0.093,0.174],[0.093,0.172],[0.037,0.171],[0.053,0.171],[0.053,0.17],[0.04,0.169],[0.053,0.169],[0.092,0.165],[-0.063,0.164],[0.09,0.162],[-0.118,0.161],[-0.13,0.153],[0.157,0.15],[-0.067,0.149],[0.025,0.14],[0.027,0.14],[0.025,0.139],[-0.148,0.138],[0.017,0.136],[-0.152,0.134],[-0.157,0.129],[0.045,0.129],[0.047,0.129],[0.122,0.128],[0.047,0.126],[0.125,0.126],[0.047,0.125],[0.048,0.124],[0.047,0.121],[-0.17,0.112],[-0.17,0.111],[-0.172,0.11],[-0.173,0.107],[-0.175,0.105],[0.057,0.101],[0.057,0.1],[0.055,0.097],[0.103,0.097],[0.103,0.096],[0.105,0.096],[0.105,0.095],[0.107,0.094],[0.107,0.09],[0.168,0.089],[0.168,0.083],[0.195,0.08],[0.108,0.079],[0.193,0.079],[0.11,0.078],[0.217,0.069],[0.102,0.047],[-0.013,0.042],[-0.183,0.036],[0.05,0.035],[-0.183,0.034],[-0.012,0.034],[-0.183,0.032],[0.043,0.032],[0.047,0.032],[-0.183,0.031],[-0.01,0.031],[-0.182,0.029],[-0.007,0.029],[-0.002,0.026],[0.0,0.026],[0.027,0.026],[0.023,0.025],[0.025,0.025],[0.027,0.025],[0.01,0.024],[0.012,0.024],[0.178,0.018],[0.182,0.016],[0.182,0.015],[0.182,0.014],[0.183,0.014],[0.182,0.013],[0.183,0.011],[0.183,0.01],[0.183,0.009],[0.183,0.008],[0.213,-0.004],[0.185,-0.032],[0.003,-0.08],[0.003,-0.081],[0.19,-0.081],[0.003,-0.084],[0.003,-0.088],[0.005,-0.089],[0.005,-0.09],[0.123,-0.096],[0.187,-0.096],[0.005,-0.098],[0.187,-0.098],[0.123,-0.099],[0.187,-0.099],[0.125,-0.1],[0.185,-0.104],[-0.107,-0.108],[0.128,-0.108],[-0.138,-0.109],[-0.14,-0.11],[0.13,-0.11],[-0.138,-0.111],[0.13,-0.111],[-0.14,-0.114],[0.13,-0.114],[0.128,-0.115],[0.13,-0.115],[-0.138,-0.116],[0.13,-0.116],[-0.138,-0.118],[0.128,-0.118],[0.13,-0.118],[-0.137,-0.12],[0.025,-0.121],[-0.137,-0.123],[-0.135,-0.123],[0.12,-0.125],[-0.135,-0.126],[0.122,-0.126],[0.123,-0.126],[-0.133,-0.127],[0.037,-0.129],[-0.133,-0.13],[-0.132,-0.132],[0.038,-0.132],[-0.132,-0.135],[-0.13,-0.135],[0.038,-0.135],[0.04,-0.136],[0.162,-0.136],[-0.13,-0.137],[0.16,-0.137],[-0.128,-0.14],[0.157,-0.14],[0.04,-0.144],[0.04,-0.145],[0.04,-0.147],[-0.123,-0.149],[0.035,-0.157],[0.033,-0.159],[0.032,-0.16],[0.033,-0.16],[0.032,-0.161],[0.032,-0.162],[0.03,-0.164],[0.03,-0.165],[0.028,-0.166],[0.025,-0.17],[0.025,-0.171],[0.02,-0.178],[0.02,-0.179],[-0.075,-0.18],[-0.073,-0.181],[0.017,-0.182],[-0.058,-0.19],[-0.057,-0.195],[0.075,-0.198],[-0.057,-0.2],[-0.053,-0.213],[-0.057,-0.22],[-0.058,-0.221],[0.07,-0.23],[-0.093,-0.233],[-0.097,-0.235],[-0.098,-0.236],[-0.098,-0.239],[-0.1,-0.24],[-0.098,-0.24],[-0.098,-0.241],[-0.098,-0.244],[-0.098,-0.246],[-0.098,-0.248],[-0.098,-0.249],[-0.097,-0.249],[-0.098,-0.251],[-0.097,-0.251],[-0.097,-0.252],[-0.097,-0.259],[-0.095,-0.266],[-0.095,-0.267],[-0.093,-0.272],[-0.092,-0.279],[-0.092,-0.28],[-0.04,-0.289],[-0.087,-0.29],[-0.04,-0.29],[-0.042,-0.291],[-0.087,-0.292],[-0.042,-0.292],[-0.042,-0.294],[-0.083,-0.295],[-0.043,-0.295],[-0.083,-0.298],[-0.05,-0.33]];

// ─── Параметры огня козы: янтарь → синий/фиолетовый ───
const FIRE_COLORS = [
  { r: 220, g: 100, b: 10 },   // янтарно-оранжевый
  { r: 180, g: 60,  b: 5  },   // тёмно-оранжевый
  { r: 100, g: 30,  b: 140},   // фиолетовый
  { r: 40,  g: 80,  b: 200},   // синий
];

// ─── Система частиц ───
const particles = [];
const MAX_PARTICLES = 400;
const SPARK_COUNT   = 60;

function randomColor() {
  const c = FIRE_COLORS[Math.floor(Math.random() * FIRE_COLORS.length)];
  const t = 0.6 + Math.random() * 0.4;
  return { r: Math.round(c.r * t), g: Math.round(c.g * t), b: Math.round(c.b * t) };
}

function spawnParticle(canvas, markerRect, isSpark) {
  const pt = CONTOUR[Math.floor(Math.random() * CONTOUR.length)];
  const scale = Math.min(markerRect.w, markerRect.h);

  const screenX = markerRect.cx + pt[0] * scale;
  const screenY = markerRect.cy - pt[1] * scale; // Y инвертирован

  const angle = Math.random() * Math.PI * 2;
  const speed = isSpark
    ? 0.4 + Math.random() * 0.8
    : 0.1 + Math.random() * 0.25;

  const col = randomColor();
  const baseSize = isSpark
    ? 1.5 + Math.random() * 2
    : 3 + Math.random() * 5;

  return {
    x: screenX, y: screenY,
    vx: isSpark ? Math.cos(angle) * speed : (Math.random() - 0.5) * 0.15,
    vy: isSpark ? Math.sin(angle) * speed : -(0.3 + Math.random() * 0.5),
    life: 1.0,
    decay: isSpark ? 0.025 + Math.random() * 0.04 : 0.008 + Math.random() * 0.012,
    size: baseSize,
    r: col.r, g: col.g, b: col.b,
    isSpark
  };
}

// ─── Canvas рендерер огня ───
let markerRect = null; // {cx, cy, w, h} в пикселях экрана
let fireActive = false;
let animFrameId = null;

function drawFire(canvas) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Полупрозрачная очистка — создаёт «хвост» пламени
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);

  if (!fireActive || !markerRect) {
    // Медленно затухаем
    for (const p of particles) p.life -= 0.03;
  } else {
    // Спавним новые частицы
    while (particles.length < MAX_PARTICLES) {
      const isSpark = particles.length < SPARK_COUNT;
      particles.push(spawnParticle(canvas, markerRect, isSpark));
    }
    // Досыпаем искры
    for (let i = 0; i < 3; i++) {
      particles.push(spawnParticle(canvas, markerRect, true));
    }
  }

  // Обновляем и рисуем
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x  += p.vx;
    p.y  += p.vy;
    p.vx += (Math.random() - 0.5) * 0.04;
    p.life -= p.decay;

    if (p.life <= 0) { particles.splice(i, 1); continue; }

    const alpha = p.isSpark ? p.life * 0.9 : p.life * 0.7;
    const size  = p.size * (p.isSpark ? p.life : 0.5 + p.life * 0.5);

    if (p.isSpark) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha})`;
      ctx.fill();
    } else {
      // Мягкое пламя через градиент
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
      grad.addColorStop(0, `rgba(${p.r},${p.g},${p.b},${alpha})`);
      grad.addColorStop(1, `rgba(${p.r},${p.g},${p.b},0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }

  animFrameId = requestAnimationFrame(() => drawFire(canvas));
}

// ─── Вспомогательное: позиция маркера через MindAR matrix ───
function extractMarkerRect(matrix, camera, W, H) {
  // MindAR даёт modelViewMatrix маркера (1×1 в мировых единицах)
  // Проецируем 4 угла и находим центр + размер на экране
  const corners = [
    [-0.5, -0.5, 0, 1],
    [ 0.5, -0.5, 0, 1],
    [ 0.5,  0.5, 0, 1],
    [-0.5,  0.5, 0, 1]
  ];

  const projMatrix = camera.projectionMatrix.elements;
  const mvMatrix   = matrix.elements;

  function project(v) {
    // mv * v
    const x = mvMatrix[0]*v[0] + mvMatrix[4]*v[1] + mvMatrix[8]*v[2]  + mvMatrix[12];
    const y = mvMatrix[1]*v[0] + mvMatrix[5]*v[1] + mvMatrix[9]*v[2]  + mvMatrix[13];
    const z = mvMatrix[2]*v[0] + mvMatrix[6]*v[1] + mvMatrix[10]*v[2] + mvMatrix[14];
    const w = mvMatrix[3]*v[0] + mvMatrix[7]*v[1] + mvMatrix[11]*v[2] + mvMatrix[15];
    // proj * mv
    const px = projMatrix[0]*x + projMatrix[4]*y + projMatrix[8]*z  + projMatrix[12]*w;
    const py = projMatrix[1]*x + projMatrix[5]*y + projMatrix[9]*z  + projMatrix[13]*w;
    const pw = projMatrix[3]*x + projMatrix[7]*y + projMatrix[11]*z + projMatrix[15]*w;
    return { sx: ((px/pw) * 0.5 + 0.5) * W, sy: ((-py/pw) * 0.5 + 0.5) * H };
  }

  const projected = corners.map(project);
  const xs = projected.map(p => p.sx);
  const ys = projected.map(p => p.sy);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);

  return {
    cx: (minX + maxX) / 2,
    cy: (minY + maxY) / 2,
    w:  maxX - minX,
    h:  maxY - minY
  };
}

// ─── Главная логика ───
document.getElementById('startBtn').addEventListener('click', async () => {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('arContainer').style.display = 'block';

  const canvas  = document.getElementById('fireCanvas');
  canvas.style.display = 'block';
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const statusEl = document.getElementById('status');

  // Запускаем рендер огня
  drawFire(canvas);

  window.addEventListener('resize', () => {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  // ─── MindAR ───
  try {
    const mindarThree = new window.MINDAR.IMAGE.MindARThree({
      container: document.getElementById('arContainer'),
      imageTargetSrc: 'targets.mind',
      maxTrack: 1,
    });

    const { renderer, scene, camera } = mindarThree;

    // Невидимый якорный объект для получения матрицы
    const anchor = mindarThree.addAnchor(0);
    const dummyGeo  = new THREE.PlaneGeometry(1, 1);
    const dummyMat  = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
    const dummyMesh = new THREE.Mesh(dummyGeo, dummyMat);
    anchor.group.add(dummyMesh);

    anchor.onTargetFound = () => {
      fireActive = true;
      statusEl.textContent = '🔥 Горит!';
      statusEl.style.color = '#f0a050';
    };
    anchor.onTargetLost = () => {
      fireActive = false;
      statusEl.textContent = 'Ищу игрушку…';
      statusEl.style.color = '#aaa';
    };

    await mindarThree.start();

    // Видео в наш тег
    const mindVideo = document.querySelector('#arContainer video');
    if (mindVideo) mindVideo.id = 'cam';

    renderer.setAnimationLoop(() => {
      // Обновляем позицию маркера
      if (fireActive && anchor.group.visible) {
        const mvMatrix = new THREE.Matrix4();
        mvMatrix.multiplyMatrices(camera.matrixWorldInverse, anchor.group.matrixWorld);
        const W = canvas.width, H = canvas.height;
        markerRect = extractMarkerRect(mvMatrix, camera, W, H);
      } else {
        markerRect = null;
      }
      renderer.render(scene, camera);
    });

  } catch (err) {
    console.error(err);
    statusEl.textContent = '⚠️ Ошибка: ' + err.message;
    // Fallback: просто показываем огонь в центре
    markerRect = { cx: canvas.width/2, cy: canvas.height/2, w: 200, h: 280 };
    fireActive = true;
    statusEl.style.color = '#f88';
  }
});
</script>
</body>
</html>
