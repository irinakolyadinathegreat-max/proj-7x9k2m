<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: -apple-system, sans-serif; }

    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px) 20px;
    }
    #hint {
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 14px 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      max-width: 360px;
      margin: 20px auto 0;
      backdrop-filter: blur(10px);
      transition: opacity 0.4s;
    }
    #hint.hidden { opacity: 0; }
    #status {
      align-self: center;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    #loader {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 16px;
      text-align: center;
      padding: 20px;
    }
    #loader.hidden { display: none; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ff7b3d;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #start-btn {
      pointer-events: auto;
      background: #ff7b3d;
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      box-shadow: 0 4px 20px rgba(255,123,61,0.4);
    }
    #start-btn:active { transform: scale(0.97); }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div>Подготовка AR-сцены...</div>
    <button id="start-btn" style="display:none;">Включить камеру</button>
  </div>

  <div id="overlay">
    <div id="hint">Наведи камеру на карточку с лошадкой</div>
    <div id="status">Ищу карточку...</div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Тестовое пламя: процедурное, чтобы не зависеть от внешней модели -->
      <a-entity id="fire" position="0 0 0.05">
        <!-- Несколько слоёв "языков пламени" -->
        <a-cone id="flame1" position="0 0.25 0" radius-bottom="0.18" radius-top="0" height="0.55" segments-radial="12" material="color: #ff4500; emissive: #ff4500; emissiveIntensity: 0.8; transparent: true; opacity: 0.75; shader: flat"></a-cone>
        <a-cone id="flame2" position="-0.12 0.18 0.02" radius-bottom="0.10" radius-top="0" height="0.40" segments-radial="12" material="color: #ff8c00; emissive: #ff8c00; emissiveIntensity: 0.9; transparent: true; opacity: 0.7; shader: flat"></a-cone>
        <a-cone id="flame3" position="0.13 0.20 0.02" radius-bottom="0.11" radius-top="0" height="0.45" segments-radial="12" material="color: #ffa500; emissive: #ffa500; emissiveIntensity: 0.9; transparent: true; opacity: 0.7; shader: flat"></a-cone>
        <a-cone id="flame4" position="0 0.32 -0.02" radius-bottom="0.07" radius-top="0" height="0.35" segments-radial="12" material="color: #ffd700; emissive: #ffd700; emissiveIntensity: 1.0; transparent: true; opacity: 0.85; shader: flat"></a-cone>
        <!-- Свечение/основание -->
        <a-sphere position="0 0.05 0" radius="0.20" material="color: #ff6600; emissive: #ff6600; emissiveIntensity: 0.6; transparent: true; opacity: 0.35; shader: flat"></a-sphere>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const loader = document.getElementById('loader');
    const startBtn = document.getElementById('start-btn');
    const hint = document.getElementById('hint');
    const status = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');
    const targetEl = document.getElementById('target');

    // Анимация пламени
    const flames = ['flame1','flame2','flame3','flame4'].map(id => document.getElementById(id));
    let t = 0;
    function animateFire() {
      t += 0.05;
      flames.forEach((f, i) => {
        const phase = t + i * 1.3;
        const sy = 1 + Math.sin(phase) * 0.18 + Math.sin(phase * 2.3) * 0.08;
        const sx = 1 + Math.cos(phase * 1.4) * 0.08;
        f.object3D.scale.set(sx, sy, sx);
        // Лёгкое смещение, мерцание
        const baseY = parseFloat(f.getAttribute('position').y);
        f.object3D.position.y = baseY + Math.sin(phase * 1.5) * 0.015;
      });
      requestAnimationFrame(animateFire);
    }

    sceneEl.addEventListener('loaded', () => {
      loader.querySelector('div:nth-child(2)').textContent = 'Готово!';
      startBtn.style.display = 'inline-block';
    });

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = 'Запускаю...';
      try {
        const mindarSystem = sceneEl.systems['mindar-image-system'];
        await mindarSystem.start();
        loader.classList.add('hidden');
        animateFire();

        // Прячем подсказку через 4 секунды
        setTimeout(() => hint.classList.add('hidden'), 4000);
      } catch (err) {
        loader.querySelector('div:nth-child(2)').innerHTML =
          'Не удалось получить доступ к камере.<br>Проверь, что разрешение выдано в настройках браузера.';
        startBtn.style.display = 'none';
        console.error(err);
      }
    });

    targetEl.addEventListener('targetFound', () => {
      status.textContent = '🔥 Горит!';
      hint.classList.add('hidden');
    });
    targetEl.addEventListener('targetLost', () => {
      status.textContent = 'Ищу карточку...';
    });
  </script>
</body>
</html>
